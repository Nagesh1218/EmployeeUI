<div class="login-container">
  <div class="login-card">
    <h2>{{ isLoginMode ? 'Sign In' : 'Create Account' }}</h2>
    <p class="subtitle">{{ isLoginMode ? 'Welcome back! Please sign in.' : 'Fill in the details to register.' }}</p>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Login Form -->
    <form *ngIf="isLoginMode" (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="loginData.username"
          required
          placeholder="Enter your username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="loginData.password"
          required
          placeholder="Enter your password"
        />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <!-- Register Form -->
    <form *ngIf="!isLoginMode" (ngSubmit)="onRegister()" #registerForm="ngForm">
      <div class="form-group">
        <label for="regUsername">Username</label>
        <input
          type="text"
          id="regUsername"
          name="username"
          [(ngModel)]="registerData.username"
          required
          minlength="3"
          placeholder="Choose a username"
        />
      </div>

      <div class="form-group">
        <label for="regEmail">Email</label>
        <input
          type="email"
          id="regEmail"
          name="email"
          [(ngModel)]="registerData.email"
          required
          email
          placeholder="Enter your email"
        />
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <input
          type="password"
          id="regPassword"
          name="password"
          [(ngModel)]="registerData.password"
          required
          minlength="6"
          placeholder="Create a password"
        />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid || loading">
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <div class="toggle-mode">
      <span *ngIf="isLoginMode">Don't have an account?</span>
      <span *ngIf="!isLoginMode">Already have an account?</span>
      <a (click)="toggleMode()">{{ isLoginMode ? 'Register' : 'Sign In' }}</a>
    </div>
  </div>
</div>
